# Drop-in for psos.service: /etc/systemd/system/psos.service.d/runtime-dir.conf
#
# Makes systemd create /run/psos owned by the service user before the app starts,
# and remove it on stop. That is the entire reason the keepalive needs no sudo,
# no setuid helper and no sudoers entry — the app just writes a file it owns.
#
# tmpfs, so the flag can never end up in the data/ backup and never survives a
# reboot. Both correct: a stale hold from a previous boot would be a lie.
[Service]
RuntimeDirectory=psos
RuntimeDirectoryMode=0755
